# v10 with the substrate fix left out: the grade reaches the taps and the dots
# but not the panel paper. Written to isolate what that fix does, then chosen
# by the owner on looks - brightening lifts the dots towards a fixed paper, so
# the grid softens as the panel gets brighter, which is the wanted behaviour.
# Identical to v10 at the shipped brightness of 1.00; they diverge only once a
# grade is moved. v10 keeps the fix and is archived beside it.
#
# Figures are on a real Game Boy palette, not a black-and-white checkerboard,
# whose light square is white - which no DMG ever displays.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.443 },
    { case = [480, 272, 1024, 768], value = 0.422 },
    { case = [480, 272,  640, 480], value = 0.485 },
]
role = ["current"]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }


