[[shader]]
name = "crt-turbo-v1.glsl"
family = "crt-turbo"
role = ["archive"]
sampler = "linear"
pattern = "output-locked"
# No curvature and one mask type. Brightness shallows the patterns instead of
# gaining the picture, for the reason lcd-turbo records - identical to
# crt-perfect-v12 at any brightness of 1.00 or below, max 1/255 over the whole
# case matrix.
#
# The exception is therefore inherited, not new: at full mask depth these are
# v12's own figures to three decimals. Both of v12's MOIRE exceptions are gone,
# and no new one is needed - the worst case reads 0.306 against a limit of 0.40.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.41 },
    { case = [160, 144, 853, 768], value = 0.92 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0 }

[[shader]]
name = "lcd-turbo-v1.glsl"
family = "lcd-turbo"
role = ["archive"]
sampler = "linear"
pattern = "whole-cell"
# Brightness shallows the mesh instead of gaining the picture: one tap cannot
# clamp per source pixel, the texture unit having already blended, and a clamp
# on the blend measured 1.860 of moire. Identical to lcd-perfect-v8 at any
# brightness of 1.00 or below - max 1/255 over the whole case matrix.
#
# The exception is therefore inherited, not new: at full stripe depth these are
# v8's own figures to three decimals, and v8 carries the same ones. It is the
# stripe's aperture error, which lcd-perfect-v7 fixed at +40% ops and was
# rejected for. Nothing here made it worse.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.27 },
    { case = [160, 144, 853, 768], value = 0.79 },
]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "dmg-turbo-v1.glsl"
family = "dmg-turbo"
role = ["archive"]
sampler = "linear"
# The shadow's caster luma is a second LINEAR tap: dot() is linear, so the four
# -tap bilinear of lumas and the luma of one bilinear tap are the same number.
#
# The exceptions are dp_gamma, which ships at 1.20 and is a pow() after the
# blend - the same cause, the same cases and within noise of the same figures as
# dmg-perfect, which reads 0.443 / 0.422 / 0.485 against these. Measured on a
# real Game Boy palette, not a white checkerboard.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.458 },
    { case = [480, 272, 1024, 768], value = 0.400 },
    { case = [480, 272,  640, 480], value = 0.459 },
]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }

[[shader]]
name = "crt-perfect-v5b.glsl"
family = "crt-perfect"
role = ["archive"]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0 }
# PSP into 640x480, pre-existing and unreviewed. Not a regression: it has read
# the same since v4, and it was masked for a long time by a worse figure from a
# shader since archived. 0.448 is the shader's own share; the raw figure was
# 0.568, of which 0.349 is the scale factor aliasing the checkerboard and
# nothing to do with this shader. Whether the rest is acceptable is a look
# decision nobody has made.
moire_allow = [{ case = [480, 272, 640, 480], value = 0.448 }]

[[shader]]
name = "crt-perfect.glsl"
family = "crt-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "crt-perfect-v11.glsl"
family = "crt-perfect"
role = ["archive"]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }
# v10 is bit-identical to the released shader at equal parameters - measured
# both ways, 0.249 and 0.434 to three decimals. Both exceedances are entirely
# its retuned defaults: scanlines 0.55 -> 0.60 and mask 0.40 -> 0.20 beat harder.
# Neither was visible before, because the tool used to pick a shader's pattern
# rule by filename prefix and never matched v6-v10. The 256x224 case has a floor
# of 0.000, so that one is all shader; the PSP case is the same pre-existing
# fault the released shader has. Owner's tuning: pinned and surfaced, not changed.
moire_allow = [
    { case = [480, 272, 640, 480], value = 0.466 },
    { case = [256, 224, 1024, 768], value = 0.434 },
]

[[shader]]
name = "crt-perfect-v12.glsl"
family = "crt-perfect"
role = ["archive"]
pattern = "output-locked"
# These ceilings describe the SHIPPED release, which still carries the defect;
# this version measures far under them on the clamp regime (0.037 against 0.541
# at GBA) and they drop the moment it is promoted. A ceiling is not approval.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.45 },
    { case = [160, 144, 853, 768], value = 0.95 },
    { case = [256, 224, 1024, 768], value = 1.55 }
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }
# v11 exists and is archived, so the next free number is v12.
#
# Brightness applied per tap before the blend and clamped there.
#
# The 256x224 exception is inherited from the release and NOT earned: that 0.434
# is this very defect at the shipped brightness of 1.25, and this version reads
# 0.070. It is here because contracts.py requires the release and the current
# version to be measured alike, and the release still has the bug. Delete it on
# promotion.
moire_allow = [
    { case = [480, 272, 640, 480], value = 0.466 },
    { case = [256, 224, 1024, 768], value = 0.434 },
]

[[shader]]
name = "crt-perfect-v10.glsl"
family = "crt-perfect"
role = ["current"]
# The head, and the shipped release: shaders/crt-perfect.glsl names v10 and is
# byte-identical to it. v11 moved gamma after the pattern and v12 moved
# brightness onto the taps; both were superseded, and v13 turned out to be this
# file with three comments added, so it was withdrawn rather than kept.
#
# Brightness multiplies the scanlines and mask as well as the colour and the
# product is clamped, so above 1.0 that clamp is a non-linearity past the blend
# and beats. That is a known and accepted trade - the alternatives clip the
# picture instead of the pattern, which is worse. See docs/crt-perfect.md.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.45 },
    { case = [160, 144, 853, 768], value = 0.95 },
    { case = [256, 224, 1024, 768], value = 1.55 }
]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }
# Both exceedances are entirely its retuned defaults: scanlines 0.55 -> 0.60 and
# mask 0.40 -> 0.20 beat harder. Neither was visible before, because the tool
# used to pick a shader's pattern rule by filename prefix and never matched
# v6-v10. The 256x224 case has a floor of 0.000, so that one is all shader; the
# PSP case is the same pre-existing fault the released shader has. Owner's
# tuning: pinned and surfaced, not changed.
moire_allow = [
    { case = [480, 272, 640, 480], value = 0.466 },
    { case = [256, 224, 1024, 768], value = 0.434 },
]

[[shader]]
name = "lcd-perfect-v3.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect.glsl"
family = "lcd-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "lcd-perfect-v9a.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# Arm A of the grid comparison: v8's sinusoid and v8's half-output-pixel phase,
# unchanged. What differs from v8 is brightness, back in the pattern gain where
# v6 has it, with the one clamp on the whole product - v8 clamped each tap and
# bleached every highlight before the mesh could shape it.
#
# ONE LINE FROM v6 - the stripe's /(1.0 + ac) peak normalisation - and the owner
# prefers v6 without it. Kept as the arm that has it.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect-v9b.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# Arm B: phase 0, so the trough sits on the source-pixel boundary and the dark
# line is shared by the two output pixels either side of it, which is where
# lcd1x puts it. Costs depth at small integer pitches - the trade recorded in
# docs/measurement.md - and buys a line that reads as being BETWEEN cells.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect-v9c.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# Arm C: the waveform changes. A narrow gap centred on the cell boundary,
# thickness given in output pixels, replacing the sinusoid - a black matrix
# rather than a soft mesh. A sinusoid is below its peak for three quarters of
# its cycle at any phase, so no phase can make one draw a thin line.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect-v8.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# These ceilings describe the SHIPPED release, which still carries the defect;
# this version measures far under them on the clamp regime (0.037 against 0.541
# at GBA) and they drop the moment it is promoted. A ceiling is not approval.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]
# Brightness applied per tap before the blend and clamped there, and the stripe
# peak-normalised: together they keep everything at or under 1 by the time the
# blend is done, so the output clamp is never reached and cannot beat.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect-v7.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# CRAWL, SUPERSEDED BY v8. Brightness multiplies the pattern as well as the
# colour and the product is clamped, so above 1.0 the clamp becomes a
# non-linearity past the blend and beats as a rainbow that walks with the
# scroll. Kept as the negative control. Confirmed on a device: absent at
# brightness 1.0, worse with every step above it, and absent at an integer
# scale at any brightness.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]

# Row/column balance ships at 0.60 rather than 0.50, leaning the mesh towards
# columns. A column mesh shares its pitch with the RGB stripes, so the two
# correlate and the beat rises with it: 0.365 at 0.50, 0.432 at 0.60, 0.620 at
# the 0.80 that matches lcd1x. Only the densest case is affected, only on a 1px
# checkerboard, and it is invisible on real content. An owner decision.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }
# Gamma moved after the blend, which halves its SFU and costs moire once it is
# turned up: 0.294 at the 1.00 default, 1.918 at 1.20, 3.622 at 1.40. Nothing is
# recorded here because the default skips the branch entirely - v5 and v4 are
# byte-identical there. A deliberate trade, judged by eye at 1.40 on real
# content, where the two are indistinguishable.
# v6 also moves gamma before the pattern, so it grades the picture without
# deepening the grid. v5 applies it after.
# v7 integrates the RGB stripes into the blend instead of multiplying them on
# after it, which is what stopped them painting a colour band that walked with
# the scroll. See docs/lcd-perfect.md.

[[shader]]
name = "lcd-perfect-v6.glsl"
family = "lcd-perfect"
role = ["current"]
pattern = "whole-cell"
# THE HEAD AGAIN, AND WHAT THE RELEASE COPIES. v8 and v9 were built to fix two
# things in it and the owner prefers it with both: brightness multiplies the
# pattern as well as the colour with one clamp on the product, and the stripe is
# not peak-normalised. The crawl below is the price of the first - confirmed on
# a device: absent at brightness 1.0, worse with every step above it, and absent
# at an integer scale at any brightness, which is the signature of a clamp after
# the blend. v9a is the same shader with the stripe normalised, kept as the
# archive arm.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.10 },
    { case = [160, 144, 853, 768], value = 1.25 },
    { case = [256, 224, 1024, 768], value = 0.52 }
]

# Superseded by v7. Kept as the negative control for crawl: its RGB stripes are
# multiplied on after the blend, so it reads 1.606 chroma at GBA geometry with
# lp_subpixels at maximum, against a limit of 0.35.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect-v5.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# Row/column balance ships at 0.60 rather than 0.50, leaning the mesh towards
# columns. A column mesh shares its pitch with the RGB stripes, so the two
# correlate and the beat rises with it: 0.365 at 0.50, 0.432 at 0.60, 0.620 at
# the 0.80 that matches lcd1x. Only the densest case is affected, only on a 1px
# checkerboard, and it is invisible on real content. An owner decision.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }
# Gamma moved after the blend, which halves its SFU and costs moire once it is
# turned up: 0.294 at the 1.00 default, 1.918 at 1.20, 3.622 at 1.40. Nothing is
# recorded here because the default skips the branch entirely - v5 and v4 are
# byte-identical there. A deliberate trade, judged by eye at 1.40 on real
# content, where the two are indistinguishable.

[[shader]]
name = "lcd-perfect-v4.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "dmg-perfect.glsl"
family = "dmg-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "dmg-perfect-v10.glsl"
family = "dmg-perfect"
# dp_gamma ships at 1.20 and this shader applies gamma after the blend, so it
# beats out of the box. An owner decision, taken by eye.
#
# These figures are on a real Game Boy palette, not a black-and-white
# checkerboard. That matters more than it sounds: a plain checkerboard's light
# square is white, which no DMG ever displays, and it read 4.621 here against
# 0.485 on the palette a core actually outputs. The palette source existed for
# this reason and was simply never wired up.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.443 },
    { case = [480, 272, 1024, 768], value = 0.422 },
    { case = [480, 272,  640, 480], value = 0.485 },
]
# No un-suffixed file exists; v9 is what the README links, so it is both what
# ships and what a default run gates on.
role = ["archive"]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }


