[[pipeline]]
label = "lcd-perfect-v9c"
cfg = "lcd-perfect-v9c.cfg"


# The *-turbo line, every iteration.
[[pipeline]]
label = "pixel-turbo-v1"
cfg = "pixel-turbo-v1.cfg"

[[pipeline]]
label = "pixel-turbo-v2"
cfg = "pixel-turbo-v2.cfg"

[[pipeline]]
label = "pixel-turbo-v3"
