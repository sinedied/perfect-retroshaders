cfg = "dmg-dot-matrix-adjust.cfg"


# The unreleased *-perfect iterations. v12 and v8 clamp brightness per tap,
# which is flat on every metric and bleaches highlights. crt went back to the
# released v10, which is why there is no crt row here beyond v12 - the
# crt-perfect row above measures the head. v9a is lcd's equivalent revert, and
# v9b and v9c are the grid arms.
[[pipeline]]
label = "crt-perfect-v12"
cfg = "crt-perfect-v12.cfg"

[[pipeline]]
label = "lcd-perfect-v8"
cfg = "lcd-perfect-v8.cfg"

[[pipeline]]
label = "lcd-perfect-v9a"
