name = "crt-mini-v4.glsl"
family = "crt-mini"
role = ["current"]
sampler = "linear"
passthrough = true
pattern = "output-locked"
# Brightness in the pattern gain, as crt-turbo-v4a. There is no a/b arm here:
# the mini has no footprint to correct, so it carries no Jacobian to trade away.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.802 },
    { case = [256, 224, 1024, 768], value = 0.671 },
    { case = [256, 192, 1024, 768], value = 0.434 },
