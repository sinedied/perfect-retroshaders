moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.802 },
    { case = [256, 224, 1024, 768], value = 0.671 },
    { case = [256, 192, 1024, 768], value = 0.434 },
    { case = [240, 160, 1024, 768], value = 0.554 },
    { case = [160, 144, 1024, 768], value = 0.498 },
    { case = [480, 272, 1024, 768], value = 1.115 },
    { case = [480, 272,  640, 480], value = 1.275 },
    { case = [320, 240, 1280, 720], value = 0.427 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

