# What each shader is, and every number it has to meet.
#
# One file so a threshold is written once and read by every tool. Before this,
# roles were inferred from filenames (which returned v8 as "newest" over v10),
# samplers were guessed per tool (so a comparison table once described a shader
# nobody runs), and limits were constants buried in whichever script used them.
#
#   role     released  what the README ships and a user installs
#            current   the newest version of a family; a default run gates here
#            archive   superseded, kept compiling and kept as a negative control
#            vendor    third-party, for comparison only, not ours, not edited
#
#   sampler  how the shader is meant to be run. Almost everything takes four
#            NEAREST taps and computes its own area average; the one-tap
#            references hand that to the texture unit and are a different
#            shader through NEAREST.
#
#   golden   a hash of the render at shipped defaults over the case matrix.
#            Proves nothing changed by accident. It does not prove correctness,
#            so a deliberate change means looking at a preview and re-recording.
#
# Perf is deliberately absent, timings and static counts alike. Timing moves a
# few percent with laptop thermals, so it is never a gate; `tools/perf.py
# --static` prints the deterministic half in a second, so recording it here
# would only duplicate it.

[settings]
# Scales that matter on the target. 3.20, 4.00, 4.27 and 6.40 at 1024x768;
# 2.00, 2.50 and 2.67 at 640x480, which are the awkward ones. PSP into 640x480
# is the hardest in the set: 1.33 output pixels per source cell, below the two
# per cycle a pattern needs, so every shader here is at its worst on it.
cases = [
    [320, 240, 1024, 768],
    [256, 224, 1024, 768],
    [256, 192, 1024, 768],
    [240, 160, 1024, 768],
    [160, 144, 1024, 768],
    [480, 272, 1024, 768],
    [480, 272,  640, 480],
    [320, 240,  640, 480],
    [256, 192,  640, 480],
    [320, 240, 1280,  720],
]

# Moire above this reads as visible banding on a flat field. Applied to what the
# SHADER adds, not the raw figure: some scales alias the content no matter what
# is drawn on it, and 480x272 -> 640x480 is 1.76 output pixels per source line,
# where an exact box average alone leaves 0.349. See box_floor() in measure.py.
moire = 0.40

# The plain scaler every family is diffed against with its effects switched off,
# and which is itself proven equal to the vendored pixellate. Declared rather
# than hardcoded in the test: naming a version in code is how a reference
# silently stops moving when the family does.
scaler_reference = "pixel-perfect-v1.glsl"

# The smallest pitch any shader here puts a pattern at, in output pixels. Both
# crt-perfect and lcd-perfect lock to this when source cells get too small to
# carry the pattern, so it is the floor of what counts as signal.
min_pitch = 3.0

# 8-bit levels. Two GPU renders of the same arithmetic should be identical;
# anything above 0 needs a mechanism, not a shrug.
tolerance = 1

# Parameters whose shipped default is right for a shader and wrong for a picture
# of it: a curvature variant rendered flat is indistinguishable from every other
# version and says nothing. Keyed by PARAMETER, never by filename - listing v6,
# v7 and v8 by name is why v9 and v10 previewed flat the moment they existed,
# and the sheet looked fine.
[settings.preview]
cp_curvature = 0.10


[[shader]]
name = "pixel-perfect-v1.glsl"
family = "pixel-perfect"
role = ["archive"]
# The scaler every other shader in this repo is built on, and the only one with
# a genuine third-party reference to check against.
equivalent_to = "pixellate.glsl"

[[shader]]
name = "pixel-perfect.glsl"
family = "pixel-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "pixel-perfect-v7.glsl"
family = "pixel-perfect"
role = ["current"]
equivalent_to = "pixellate.glsl"
# At a neutral grade it must still be the plain scaler.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "pixel-perfect-v6.glsl"
family = "pixel-perfect"
role = ["archive"]
equivalent_to = "pixellate.glsl"
# At a neutral grade it must still be the plain scaler.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "crt-perfect-v5b.glsl"
family = "crt-perfect"
role = ["archive"]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0 }
# PSP into 640x480, pre-existing and unreviewed. Not a regression: it has read
# the same since v4, and it was masked for a long time by a worse figure from a
# shader since archived. 0.448 is the shader's own share; the raw figure was
# 0.568, of which 0.349 is the scale factor aliasing the checkerboard and
# nothing to do with this shader. Whether the rest is acceptable is a look
# decision nobody has made.
moire_allow = [{ case = [480, 272, 640, 480], value = 0.448 }]

[[shader]]
name = "crt-perfect.glsl"
family = "crt-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "crt-perfect-v11.glsl"
family = "crt-perfect"
role = ["current"]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }
# v10 is bit-identical to the released shader at equal parameters - measured
# both ways, 0.249 and 0.434 to three decimals. Both exceedances are entirely
# its retuned defaults: scanlines 0.55 -> 0.60 and mask 0.40 -> 0.20 beat harder.
# Neither was visible before, because the tool used to pick a shader's pattern
# rule by filename prefix and never matched v6-v10. The 256x224 case has a floor
# of 0.000, so that one is all shader; the PSP case is the same pre-existing
# fault the released shader has. Owner's tuning: pinned and surfaced, not changed.
moire_allow = [
    { case = [480, 272, 640, 480], value = 0.466 },
    { case = [256, 224, 1024, 768], value = 0.434 },
]

[[shader]]
name = "crt-perfect-v10.glsl"
family = "crt-perfect"
role = ["archive"]
pattern = "output-locked"
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }
# v10 is bit-identical to the released shader at equal parameters - measured
# both ways, 0.249 and 0.434 to three decimals. Both exceedances are entirely
# its retuned defaults: scanlines 0.55 -> 0.60 and mask 0.40 -> 0.20 beat harder.
# Neither was visible before, because the tool used to pick a shader's pattern
# rule by filename prefix and never matched v6-v10. The 256x224 case has a floor
# of 0.000, so that one is all shader; the PSP case is the same pre-existing
# fault the released shader has. Owner's tuning: pinned and surfaced, not changed.
moire_allow = [
    { case = [480, 272, 640, 480], value = 0.466 },
    { case = [256, 224, 1024, 768], value = 0.434 },
]

[[shader]]
name = "lcd-perfect-v3.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-perfect.glsl"
family = "lcd-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "lcd-perfect-v6.glsl"
family = "lcd-perfect"
role = ["current"]
pattern = "whole-cell"
# Row/column balance ships at 0.60 rather than 0.50, leaning the mesh towards
# columns. A column mesh shares its pitch with the RGB stripes, so the two
# correlate and the beat rises with it: 0.365 at 0.50, 0.432 at 0.60, 0.620 at
# the 0.80 that matches lcd1x. Only the densest case is affected, only on a 1px
# checkerboard, and it is invisible on real content. An owner decision.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }
# Gamma moved after the blend, which halves its SFU and costs moire once it is
# turned up: 0.294 at the 1.00 default, 1.918 at 1.20, 3.622 at 1.40. Nothing is
# recorded here because the default skips the branch entirely - v5 and v4 are
# byte-identical there. A deliberate trade, judged by eye at 1.40 on real
# content, where the two are indistinguishable.
# v6 also moves gamma before the pattern, so it grades the picture without
# deepening the grid. v5 applies it after.

[[shader]]
name = "lcd-perfect-v5.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
# Row/column balance ships at 0.60 rather than 0.50, leaning the mesh towards
# columns. A column mesh shares its pitch with the RGB stripes, so the two
# correlate and the beat rises with it: 0.365 at 0.50, 0.432 at 0.60, 0.620 at
# the 0.80 that matches lcd1x. Only the densest case is affected, only on a 1px
# checkerboard, and it is invisible on real content. An owner decision.
moire_allow = [{ case = [480, 272, 1024, 768], value = 0.432 }]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }
# Gamma moved after the blend, which halves its SFU and costs moire once it is
# turned up: 0.294 at the 1.00 default, 1.918 at 1.20, 3.622 at 1.40. Nothing is
# recorded here because the default skips the branch entirely - v5 and v4 are
# byte-identical there. A deliberate trade, judged by eye at 1.40 on real
# content, where the two are indistinguishable.

[[shader]]
name = "lcd-perfect-v4.glsl"
family = "lcd-perfect"
role = ["archive"]
pattern = "whole-cell"
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "dmg-perfect.glsl"
family = "dmg-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "dmg-perfect-v10.glsl"
family = "dmg-perfect"
# dp_gamma ships at 1.20 and this shader applies gamma after the blend, so it
# beats out of the box. An owner decision, taken by eye.
#
# These figures are on a real Game Boy palette, not a black-and-white
# checkerboard. That matters more than it sounds: a plain checkerboard's light
# square is white, which no DMG ever displays, and it read 4.621 here against
# 0.485 on the palette a core actually outputs. The palette source existed for
# this reason and was simply never wired up.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.443 },
    { case = [480, 272, 1024, 768], value = 0.422 },
    { case = [480, 272,  640, 480], value = 0.485 },
]
# No un-suffixed file exists; v9 is what the README links, so it is both what
# ships and what a default run gates on.
role = ["current"]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }


