[[shader]]
name = "pixel-perfect-v1.glsl"
family = "pixel-perfect"
role = ["archive"]
# The scaler every other shader in this repo is built on, and the only one with
# a genuine third-party reference to check against.
equivalent_to = "pixellate.glsl"

[[shader]]
name = "pixel-perfect.glsl"
family = "pixel-perfect"
# The shipped copy. Its header says which iteration it is, and check.py asserts
# the two files are byte-identical; everything else is inherited from the source.
role = ["released"]

[[shader]]
name = "pixel-perfect-v7.glsl"
family = "pixel-perfect"
role = ["current"]
equivalent_to = "pixellate.glsl"
# At a neutral grade it must still be the plain scaler.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "pixel-perfect-v6.glsl"
family = "pixel-perfect"
role = ["archive"]
equivalent_to = "pixellate.glsl"
# At a neutral grade it must still be the plain scaler.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }


# --- the *-turbo line: the same pictures, rebuilt for the device -------------
#
# One LINEAR tap instead of four NEAREST ones. The texture unit computes the
# same weighted sum the four-tap blend did, so these are the same scaler by
# construction - and a different, much worse one if anything runs them through
# NEAREST, which is why every one of them declares its sampler here.

# v2 across the line: brightness becomes a MIDTONE LIFT rather than a gain or a
# pattern-shallowing. One tap cannot clamp a gain per source pixel - the texture
# unit has already blended - so a gain has to clip after the blend, which is the
# non-linearity the design rule names. An exponent leaves 0 at 0 and 1 at 1, so
# nothing ever clips; it beats instead, and that is the exception each of these
# records. The evidence for taking it is in docs/optimized/overview.md: it does not crawl
# (0.000), it is exactly zero at an integer scale, and on real game frames it is
# a median 0.99 levels RMS against 11.30 on the synthetic checkerboard the gate
# renders.

[[shader]]
name = "pixel-turbo-v3.glsl"
family = "pixel-turbo"
role = ["current"]
sampler = "linear"
# No exceptions at all: brightness is pixel-perfect's folded affine again, so
# this is that shader's grading exactly, on one tap instead of four.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "pixel-turbo-v2.glsl"
family = "pixel-turbo"
role = ["archive"]
sampler = "linear"
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "crt-turbo-v4a.glsl"
family = "crt-turbo"
role = ["current"]
sampler = "linear"
pattern = "output-locked"
# Brightness is crt-perfect v10's again: multiplied into the pattern gain with
# the one clamp on the product. v3 clamped the content before the pattern, which
# is v12's look and beats 15x harder - 7.256 against 0.480 at the shipped 1.25.
# So this drops from seven moire exceptions to one.
moire_allow = [
    { case = [256, 224, 1024, 768], value = 0.442 },
    { case = [480, 272,  640, 480], value = 0.480 },
]
# The same three cases crt-perfect carries, and for the same reason: this is its
# brightness, so it inherits its regime.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.41 },
    { case = [160, 144, 853, 768], value = 0.92 },
    { case = [256, 224, 1024, 768], value = 1.50 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

[[shader]]
name = "crt-turbo-v4b.glsl"
family = "crt-turbo"
role = ["archive"]
sampler = "linear"
pattern = "output-locked"
# The cheap arm. v4a multiplies the warp's Jacobian into h, which is exact under
# curvature and makes h - and every pitch and lock term downstream - per-fragment
# whether curvature is on or off. Pinning it restores the hoist for everyone who
# never turns curvature on, and costs a little corner contrast for those who do.
# Identical to v4a at cp_curvature 0.
moire_allow = [
    { case = [256, 224, 1024, 768], value = 0.442 },
    { case = [480, 272,  640, 480], value = 0.480 },
]
# The same three cases crt-perfect carries, and for the same reason: this is its
# brightness, so it inherits its regime.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.41 },
    { case = [160, 144, 853, 768], value = 0.92 },
    { case = [256, 224, 1024, 768], value = 1.50 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

[[shader]]
name = "crt-turbo-v3.glsl"
family = "crt-turbo"
role = ["archive"]
sampler = "linear"
pattern = "output-locked"
# BRIGHTNESS IS A PLAIN GAIN AGAIN, clamped before the pattern, because v2's
# midtone form was just gamma wearing a different name - pow(c, g/b) divides the
# same exponent. A clamp after the blend beats, and one tap has no per-source
# clamp to use instead, so these are the price. Every one is zero at
# cp_brightness 1.00; the default is 1.25. Worse than v2's, which is the honest
# reading: a clip has a harder edge than a curve. See docs/optimized/overview.md.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 3.743 },
    { case = [256, 224, 1024, 768], value = 2.668 },
    { case = [240, 160, 1024, 768], value = 2.190 },
    { case = [160, 144, 1024, 768], value = 2.325 },
    { case = [480, 272, 1024, 768], value = 3.621 },
    { case = [480, 272,  640, 480], value = 7.256 },
    { case = [256, 192,  640, 480], value = 0.924 },
]
# Unchanged from v2 to two decimals: this regime is measured at brightness 1.00,
# where the gain is a no-op and v3 is bit-identical to v2.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.41 },
    { case = [160, 144, 853, 768], value = 0.92 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

[[shader]]
name = "crt-turbo-v2.glsl"
family = "crt-turbo"
role = ["archive"]
sampler = "linear"
pattern = "output-locked"
# Curvature and the slot grille are back: measured at 449 ops with either
# present but unselected, against 449 without them at all, so cutting them in v1
# bought nothing at the shipped default.
#
# THE MOIRE EXCEPTIONS ARE THE MIDTONE LIFT, and they are the largest quality
# decision in this repository. Taken deliberately, on the owner's instruction,
# with the evidence in docs/optimized/overview.md. Every one of them is zero at
# cp_brightness 1.00. Delete them and the shader is inside the limit everywhere.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 2.001 },
    { case = [256, 224, 1024, 768], value = 1.485 },
    { case = [240, 160, 1024, 768], value = 1.193 },
    { case = [160, 144, 1024, 768], value = 1.292 },
    { case = [480, 272, 1024, 768], value = 2.011 },
    { case = [480, 272,  640, 480], value = 4.169 },
    { case = [256, 192,  640, 480], value = 0.604 },
]
# Inherited from v1 to three decimals: at cp_brightness 1.00, where this regime
# is measured, v2 is bit-identical to crt-perfect-v12.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.41 },
    { case = [160, 144, 853, 768], value = 0.92 },
]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

[[shader]]
name = "lcd-turbo-v4.glsl"
family = "lcd-turbo"
role = ["current"]
sampler = "linear"
pattern = "whole-cell"
# THE RELEASED lcd-perfect, APART FROM THE SCALER - and measured that way:
# 0/255 over every integer scale at every brightness from 0.25 to 4.00, where
# the one-tap and four-tap scalers agree and any difference would have to be
# arithmetic. v3 read 137/255 on the same sweep.
#
# Two edits got there: brightness back in the pattern gain, and the stripe left
# un-normalised. Both are what the release does. Moire drops from v3's six
# exceptions to one, and the crawl regime becomes lcd-perfect's own - the clamp
# on the product, which is the trade the owner chose. Inherited, not new: these
# are within 0.07 of v6's own figures.
moire_allow = [
    { case = [480, 272, 1024, 768], value = 0.435 },
]
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 2.03 },
    { case = [160, 144,  853, 768], value = 1.18 },
    { case = [256, 224, 1024, 768], value = 0.48 },
]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-mini-v4.glsl"
family = "lcd-mini"
role = ["current"]
sampler = "linear"
passthrough = true
pattern = "whole-cell"
# The same two edits as lcd-turbo-v4, and NO EXCEPTIONS AT ALL - v3 carried six
# for moire, worst 1.062, and the worst case here reads 0.110 against a limit of
# 0.40. Nothing to declare is the strongest result available.
moire_allow = []
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-turbo-v3.glsl"
family = "lcd-turbo"
role = ["archive"]
sampler = "linear"
pattern = "whole-cell"
# The plain gain, as in crt-turbo. Zero at lp_brightness 1.00.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 3.319 },
    { case = [256, 224, 1024, 768], value = 2.856 },
    { case = [240, 160, 1024, 768], value = 1.880 },
    { case = [160, 144, 1024, 768], value = 2.124 },
    { case = [480, 272, 1024, 768], value = 3.400 },
    { case = [480, 272,  640, 480], value = 1.445 },
]
# Unchanged from v2: measured at brightness 1.00, where v3 is bit-identical.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.27 },
    { case = [160, 144, 853, 768], value = 0.79 },
]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "lcd-turbo-v2.glsl"
family = "lcd-turbo"
role = ["archive"]
sampler = "linear"
pattern = "whole-cell"
# The midtone lift, as above. Zero at lp_brightness 1.00.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 1.860 },
    { case = [256, 224, 1024, 768], value = 1.589 },
    { case = [240, 160, 1024, 768], value = 1.029 },
    { case = [160, 144, 1024, 768], value = 1.182 },
    { case = [480, 272, 1024, 768], value = 1.853 },
    { case = [480, 272,  640, 480], value = 0.695 },
]
# Inherited: at lp_brightness 1.00 this is lcd-perfect-v8 to within 1/255.
crawl_allow = [
    { case = [240, 160, 1024, 682], value = 1.27 },
    { case = [160, 144, 853, 768], value = 0.79 },
]
neutral = { lp_grid = 0.0, lp_subpixels = 0.0, lp_brightness = 1.0, lp_gamma = 1.0 }

[[shader]]
name = "dmg-turbo-v3.glsl"
family = "dmg-turbo"
role = ["current"]
sampler = "linear"
# NOT the brightness change - dp_brightness ships at 1.00 and, as in the
# released shader, it is folded into the balance factor rather than clamped, so
# it never reaches the substrate. These are dp_gamma at 1.20, the same
# post-blend pow() and the same cases dmg-perfect carries. Unchanged from v2.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.458 },
    { case = [480, 272,  640, 480], value = 0.459 },
]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }

[[shader]]
name = "dmg-turbo-v2.glsl"
family = "dmg-turbo"
role = ["archive"]
sampler = "linear"
# NOT the midtone lift - dp_brightness ships at 1.00, so the lift is off. These
# are dp_gamma at 1.20, the same post-blend pow() and the same cases dmg-perfect
# carries, which reads 0.443 / 0.485 against these. Measured on a real Game Boy
# palette, not a white checkerboard.
moire_allow = [
    { case = [320, 240, 1024, 768], value = 0.458 },
    { case = [480, 272,  640, 480], value = 0.459 },
]
neutral = { dp_grid = 0.0, dp_shadow = 0.0, dp_brightness = 1.0, dp_gamma = 1.0, dp_temperature = 0.0, dp_tint = 0.0 }


# The *-mini line: each turbo shader minus the scaler, so a user can choose
# their own - or none. Versioned to match their turbo counterpart, which is why
# they start at v2 with no v1.
#
# passthrough says they do no scaling, so the scaler anchor does not apply to
# them; contracts.py proves instead that at 1:1 with everything off they hand
# the picture through untouched, which is what "behind any scaler" has to mean.
#
# LINEAR, so that behind a scaler they are exact at 1:1 (measured: identical)
# and the warp in crt-mini is smoothed rather than aliased. Standalone they are
# a plain bilinear upscale, which is a legitimate choice and is documented.

[[shader]]
name = "colour-mini-v3.glsl"
family = "colour-mini"
role = ["current"]
sampler = "linear"
passthrough = true
# No exceptions, as pixel-turbo.
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

[[shader]]
name = "colour-mini-v2.glsl"
family = "colour-mini"
role = ["archive"]
sampler = "linear"
passthrough = true
neutral = { pp_brightness = 1.0, pp_contrast = 1.0, pp_saturation = 1.0, pp_gamma = 1.0, pp_temperature = 0.0, pp_tint = 0.0 }

