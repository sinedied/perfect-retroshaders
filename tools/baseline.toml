]
neutral = { cp_scanlines = 0.0, cp_rgb_mask = 0.0, cp_brightness = 1.0, cp_gamma = 1.0, cp_curvature = 0.0 }

[[shader]]
name = "crt-mini-v3.glsl"
family = "crt-mini"
role = ["archive"]
sampler = "linear"
passthrough = true
pattern = "output-locked"
# Measured STANDALONE, which is the mini line at its worst: with no scaler in
# front the sampler does a bilinear upscale and the pattern rides that rather
