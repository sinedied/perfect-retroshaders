# What each shader is, and every number it has to meet.
#
# One file so a threshold is written once and read by every tool. Before this,
# roles were inferred from filenames (which returned v8 as "newest" over v10),
# samplers were guessed per tool (so a comparison table once described a shader
# nobody runs), and limits were constants buried in whichever script used them.
#
#   role     released  what the README ships and a user installs
#            current   the newest version of a family; a default run gates here
#            archive   superseded, kept compiling and kept as a negative control
#            vendor    third-party, for comparison only, not ours, not edited
#
#   sampler  how the shader is meant to be run. Almost everything takes four
#            NEAREST taps and computes its own area average; the one-tap
#            references hand that to the texture unit and are a different
#            shader through NEAREST.
#
#   golden   a hash of the render at shipped defaults over the case matrix.
#            Proves nothing changed by accident. It does not prove correctness,
#            so a deliberate change means looking at a preview and re-recording.
#
# Perf is deliberately absent, timings and static counts alike. Timing moves a
# few percent with laptop thermals, so it is never a gate; `tools/perf.py
# --static` prints the deterministic half in a second, so recording it here
# would only duplicate it.

[settings]
# Scales that matter on the target. 3.20, 4.00, 4.27 and 6.40 at 1024x768;
# 2.00, 2.50 and 2.67 at 640x480, which are the awkward ones. PSP into 640x480
# is the hardest in the set: 1.33 output pixels per source cell, below the two
# per cycle a pattern needs, so every shader here is at its worst on it.
cases = [
    [320, 240, 1024, 768],
    [256, 224, 1024, 768],
    [256, 192, 1024, 768],
    [240, 160, 1024, 768],
    [160, 144, 1024, 768],
    [480, 272, 1024, 768],
    [480, 272,  640, 480],
    [320, 240,  640, 480],
    [256, 192,  640, 480],
    [320, 240, 1280,  720],
]

# Moire above this reads as visible banding on a flat field. Applied to what the
# SHADER adds, not the raw figure: some scales alias the content no matter what
# is drawn on it, and 480x272 -> 640x480 is 1.76 output pixels per source line,
# where an exact box average alone leaves 0.349. See box_floor() in measure.py.
moire = 0.40

# The plain scaler every family is diffed against with its effects switched off,
# and which is itself proven equal to the vendored pixellate. Declared rather
# than hardcoded in the test: naming a version in code is how a reference
# silently stops moving when the family does.
scaler_reference = "pixel-perfect-v1.glsl"

# The smallest pitch any shader here puts a pattern at, in output pixels. Both
# crt-perfect and lcd-perfect lock to this when source cells get too small to
# carry the pattern, so it is the floor of what counts as signal.
min_pitch = 3.0

# Crawl: the low-frequency colour band a shader paints on when the picture
# scrolls, in 8-bit levels, over what the scale factor makes unavoidable.
#
# Measured at each colour parameter's MAXIMUM, not its shipped default. A
# guarded effect only shows its artifacts with it turned on, the same reason
# perf.py has MAXED - and at 0.20 the stripes hid under the scaler's own floor
# while still being visible to a person scrolling a game.
#
# 0.35 is a hair over what a corrected pattern leaves and far under the 1.6 the
# uncorrected one reads, so it separates the two without sitting on either.
crawl = 0.35

# The cases crawl is measured on. NOT the full matrix: it renders a scroll
# sequence, so it costs eight renders a case, and the artifact needs a
# non-integer scale to exist at all.
#
# The first two are the geometry aspect scaling actually produces on the target
# for GBA and GBC - 1024x682 and 853x768, not the 1024x768 the moire cases all
# use. The third is an integer scale and must read zero: scrolling an exact 4x
# moves the picture a whole number of output pixels, so nothing can change, and
# a metric that reports otherwise is measuring itself.
crawl_cases = [
    [240, 160, 1024, 682],
    [160, 144,  853, 768],
    [256, 224, 1024, 768],
]

# 8-bit levels. Two GPU renders of the same arithmetic should be identical;
# anything above 0 needs a mechanism, not a shrug.
tolerance = 1

# Parameters whose shipped default is right for a shader and wrong for a picture
# of it: a curvature variant rendered flat is indistinguishable from every other
# version and says nothing. Keyed by PARAMETER, never by filename - listing v6,
# v7 and v8 by name is why v9 and v10 previewed flat the moment they existed,
# and the sheet looked fine.
[settings.preview]
cp_curvature = 0.10

# What crawl is measured at, per family. Each entry is a list of parameter sets,
# and the worst of them is the figure; a shader is measured at every one.
#
# BRIGHTNESS IS IN HERE, and it is the point. The artifact is the output clamp,
# so it does not exist until the gain drives content past 1 - measured on a
# device, invisible at 1.0 and worse with every step above it. Measuring at the
# shipped default would have called both shaders clean. Same reasoning as MAXED
# in perf.py: a control that guards a cost only shows it when it is turned on.
#
# Both entries are measured, not just the second: the fix for the clamp is
# NON-MONOTONIC in brightness - it reads 0.047 at 1.0 and 0.000 at 2.0, because
# heavy clipping is uniform clipping - so a high value alone would miss what the
# pattern does on its own.
#
# Keyed by family rather than by filename, because listing versions by name is
# how the preview overrides silently stopped applying the moment a v9 existed. A
# family with no entry is not measured: dmg-perfect is deliberately absent, its
# grid being neutral, and it has a crawl of its own from a cause nobody has
# looked at yet.
[settings.crawl_at]
# Two regimes, because two different defects live here and one set cannot see
# both. The first is the clamp: the pattern at its SHIPPED depth with the
# brightness turned up, which is what a user actually runs into. The second is
# the pattern's own aperture error at full depth with no clamp at all, which is
# a separate and much more expensive thing to fix - see docs/lcd-perfect.md.
lcd-perfect = [
    { lp_subpixels = 0.20, lp_brightness = 2.00 },
    { lp_subpixels = 1.00, lp_brightness = 1.00 },
]
crt-perfect = [
    { cp_rgb_mask = 0.20, cp_brightness = 2.00 },
    { cp_rgb_mask = 1.00, cp_brightness = 1.00 },
]

# Same two regimes for the *-turbo line, and measured at the same settings so
# the pair is comparable. The turbo shaders cannot clamp per source pixel - one
# tap means the texture unit has already blended - so brightness is a curve
# rather than a gain there, and this is where that has to prove itself.
lcd-turbo = [
    { lp_subpixels = 0.20, lp_brightness = 2.00 },
    { lp_subpixels = 1.00, lp_brightness = 1.00 },
]
crt-turbo = [
    { cp_rgb_mask = 0.20, cp_brightness = 2.00 },
    { cp_rgb_mask = 1.00, cp_brightness = 1.00 },
]

# The device benchmark's one case. Everything tools/device measures runs at this
# size: a 320x240 source into a 1024x768 output, which is the Brick's panel and
# the scale factor the README screenshots use.
#
# budget_ms is one frame at 60fps. It is what makes an absolute figure mean
# anything - "4.1ms" says nothing on its own, "25% of the frame" says whether
# there is room for an emulator underneath it.
[settings.device]
source = [320, 240]
output = [1024, 768]
budget_ms = 16.6667


# The pipelines the device benchmark runs, in table order.
#
# A pipeline is a minarch .cfg in tools/device/pipelines, which is the same file
# a user installs - not a benchmark-only format that could drift away from what
# the device actually runs. Adding a row is a file and a stanza here, never a
# code change.
#
# THE FIRST ENTRY IS THE REFERENCE every relative percentage is measured against,
# and it is deliberately pixellate rather than one of ours: it ships on the
# target and holds 60fps, so it is the budget, and a row reading 130% means the
# same frame time buys 30% more than the thing already known to fit.
#
# EVERY ITERATION IS HERE, not just the head, so the table shows the progression
# rather than a single number with nothing to read it against.
[[pipeline]]
label = "pixellate"
cfg = "pixellate.cfg"

[[pipeline]]
label = "pixellate -> lcd3x"
cfg = "pixellate-lcd3x.cfg"

[[pipeline]]
label = "pixel-perfect"
cfg = "pixel-perfect.cfg"

[[pipeline]]
label = "crt-perfect"
cfg = "crt-perfect.cfg"

[[pipeline]]
label = "lcd-perfect"
cfg = "lcd-perfect.cfg"

[[pipeline]]
label = "dmg-perfect"
cfg = "dmg-perfect.cfg"

[[pipeline]]
label = "sharp-shimmerless"
cfg = "sharp-shimmerless.cfg"


# The reference stacks: what a user can already run today, measured the same way
# so our rows have something real to be read against. Each is the cheapest thing
# of its kind, assembled the way the frontend assembles it.
[[pipeline]]
label = "shimmerless -> lcd1x"
cfg = "shimmerless-lcd1x.cfg"

[[pipeline]]
label = "shimmerless -> lcd3x"
cfg = "shimmerless-lcd3x.cfg"

[[pipeline]]
