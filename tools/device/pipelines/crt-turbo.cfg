# crt-turbo at shipped defaults. One LINEAR tap, and LINEAR is not optional:
# through NEAREST the texture unit does no blending and there is no second tap
# to fall back on, so what gets measured is nearest-neighbour.
#
# No curvature row, because there is no curvature control: it was the single
# most expensive thing in crt-perfect and is not in the turbo line.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = crt-turbo-v1.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
