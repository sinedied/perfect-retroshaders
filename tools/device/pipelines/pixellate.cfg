# pixellate, the budget yardstick: it ships on the target handheld and holds
# 60fps, so it defines what a shader here is allowed to cost.
#
# INTERPOLATE_IN_LINEAR_GAMMA is written out rather than left to its default,
# even though 1.0 IS its default. tools/vendor/README.md records that rendering
# pixellate with it at 0 flatters it by removing the one thing wrong with it, so
# the value it is measured at is stated here rather than inferred.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = pixellate.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen

INTERPOLATE_IN_LINEAR_GAMMA = 1.00
