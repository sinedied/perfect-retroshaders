# crt-perfect at shipped defaults. Note that curvature ships at 0 and so is not
# measured here; it is a guarded block, and what a guarded feature costs is only
# visible with it on.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = crt-perfect.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
