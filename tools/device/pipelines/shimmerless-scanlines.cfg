# The crt reference stack: a one-tap scale feeding scanlines and nothing else.
# One sin() per fragment, no mask, no prefilter and no band-limiting - so it is
# the floor for "a scanline shader that works", and what crt-turbo has to beat
# while also drawing a mask.
#
# autoscale = 1 rather than the shipped 0. Left at 0 it locks the scanline pitch
# to a hardcoded 224 lines whatever the source is, which is not what a user
# running a 320x240 core gets, and would measure a slightly different picture at
# every case in the matrix.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = res-independent-scanlines.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen

autoscale = 1.00
