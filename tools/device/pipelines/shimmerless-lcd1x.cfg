# The lcd reference stack, first half: a one-tap scale feeding a scanline pass.
#
# This is what already works on the device, and therefore the bar lcd-turbo has
# to clear rather than a hypothetical budget. Both halves are the cheapest thing
# of their kind: sharp-shimmerless hands the box filter to the texture unit, and
# lcd1x is two sin() calls with no prefilter.
#
# LINEAR on pass 1, NEAREST on pass 2. sharp-shimmerless ships with
# filter_linear0 = true and through NEAREST it is nearest-neighbour, which is a
# different shader; lcd1x point-samples and wants no filtering under it.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = lcd1x.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
