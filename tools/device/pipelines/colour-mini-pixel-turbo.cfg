# Grading IN FRONT of the scaler, at source resolution: upscale = 1, so pass 1
# renders at 320x240 and pass 2 does the scale.
#
# This is the moire exception's escape hatch. A curve applied after the blend
# beats, because the blend has already collapsed a varying footprint to one
# number; applied at source resolution it is per source pixel, which is what the
# design rule asks for and what the released line does with its per-tap clamp.
# Set the brightness here and leave the scaler's at 1.00.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = colour-mini-v3.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = 1
minarch_shader2 = pixel-turbo-v3.glsl
minarch_shader2_filter = LINEAR
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
