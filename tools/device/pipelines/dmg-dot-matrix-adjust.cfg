# The dmg golden path: the dot matrix with its own brightness and gamma off,
# and image-adjustment doing the grading in a pass of its own.
#
# This is the row dmg-turbo has to beat. A scale in front would be nice and is
# explicitly optional - the reference does without one, so the comparison is
# against no scaler at all.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = dmg_dot_matrix.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = image-adjustment.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen

dmg_brightness_correction = 1.00
dmg_gamma = 1.00
