# image-adjustment alone: the RetroArch grading pass with no scaler in front of
# it, which is what makes "what does grading cost by itself" answerable. It is
# the reason every otherwise-cheap reference stack stops fitting in a frame.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = image-adjustment.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
