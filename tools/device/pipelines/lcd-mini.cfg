# lcd-mini alone, as pass 1. The mesh and the RGB stripes without the scaler,
# and without lcd-turbo's aperture blend - there is no blend here to weight.
#
# This is the row that decides whether the mini split pays: it is the one place
# dropping the scaler removes real per-fragment work rather than moving it.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = lcd-mini-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
