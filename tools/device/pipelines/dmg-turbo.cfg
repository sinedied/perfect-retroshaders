# dmg-turbo at shipped defaults. Two LINEAR taps: one for the scale, one for
# the shadow's caster luma. LINEAR is not optional - through NEAREST both
# become point samples and the panel is a different shader.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = dmg-turbo-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
