# barrel-distortion alone: curvature and nothing else. The reference for what a
# warp costs on its own, which is the question crt-turbo's curvature raises -
# it costs 3.26 ms there with the slider at zero, and this row says how much of
# that is the warp itself rather than the hoisting it breaks.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = barrel-distortion.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
