# dmg-mini alone, as pass 1. The dot matrix and its cell shadow without the
# scaler. Two taps, not one: the shadow reads a neighbouring cell's luma, which
# no amount of texcoord arithmetic folds into the colour tap.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = dmg-mini-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
