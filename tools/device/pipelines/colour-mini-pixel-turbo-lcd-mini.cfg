# The whole mini line assembled clean: grade at source resolution, scale, then
# draw the panel. Three passes, which is the harness maximum, and the only
# assembly here that carries no moire exception at any brightness.
#
# Read against lcd-turbo, which does the same three jobs in one pass and takes
# the exception instead. That pair is the choice this line exists to offer.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 3
minarch_shader1 = colour-mini-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = 1
minarch_shader2 = pixel-turbo-v2.glsl
minarch_shader2_filter = LINEAR
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
minarch_shader3 = lcd-mini-v2.glsl
minarch_shader3_filter = LINEAR
minarch_shader3_srctype = source
minarch_shader3_scaletype = source
minarch_shader3_upscale = screen
