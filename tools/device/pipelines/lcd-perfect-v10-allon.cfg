# lcd-perfect-v10 with every feature turned up, the second row of the perf table.
# Parameters are the same MAXED set tools/perf.py uses, so the desktop and the
# device columns describe the same configuration.
lp_gamma = 1.4
lp_grid = 1.0
lp_subpixels = 1.0
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = lcd-perfect-v10.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
