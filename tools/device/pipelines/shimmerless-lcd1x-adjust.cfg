# The whole lcd golden path, as a user would actually assemble it: scale, panel
# effect, colour controls. Three passes, which is the harness maximum.
#
# lcd-turbo is one shader replacing all three, so this is the row that decides
# whether the turbo line is worth having at all.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 3
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = lcd1x.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
minarch_shader3 = image-adjustment.glsl
minarch_shader3_filter = NEAREST
minarch_shader3_srctype = source
minarch_shader3_scaletype = source
minarch_shader3_upscale = screen
