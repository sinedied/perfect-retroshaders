# The mini line assembled the way it is meant to be used: pixel-turbo does the
# scaling, crt-mini draws the tube. Two passes where crt-turbo is one, for the
# same picture.
#
# Read against crt-turbo, this is the price of composability - and, by
# subtraction against crt-mini alone, the price of a second pass on a tile-based
# GPU, which the one 2-pass row measured so far put at nothing.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = pixel-turbo-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = crt-mini-v2.glsl
minarch_shader2_filter = LINEAR
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
