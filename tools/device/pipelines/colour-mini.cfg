# colour-mini alone, as pass 1. No pattern, no scaler - the frontend upscales
# and this only grades, so what gets measured is the floor of the mini line: one
# tap, one pow, six multiplies. Every other mini row is this plus a pattern.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = colour-mini-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
