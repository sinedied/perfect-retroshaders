# res-independent-scanlines alone, no scaler in front: the pipeline the README's
# crt-perfect screenshot is compared against. Scanlines and nothing else.
#
# autoscale = 1 rather than the shipped 0, matching shimmerless-scanlines.cfg.
# Left at 0 it locks the scanline pitch to a hardcoded 224 lines whatever the
# source is, which is not what a user running a 320x240 core gets.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = res-independent-scanlines.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen

autoscale = 1.00
