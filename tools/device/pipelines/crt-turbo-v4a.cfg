# crt-turbo v4a, the head. Brightness rides the pattern gain, as crt-perfect
# v10 does it - 0.480 moire against v3's 7.256. Curvature and the slot mask are
# present and off; the slot mask really is free that way, curvature is not.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = crt-turbo-v4a.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
