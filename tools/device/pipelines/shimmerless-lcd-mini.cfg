# The cheapest scaler in the repo in front of lcd-mini. Same shape as
# shimmerless -> lcd1x, so the two rows differ only in the panel shader and the
# pair prices lcd-mini against the thing users already run.
#
# sharp-shimmerless is a 1-tap linear-blend scaler; it is softer than
# pixel-turbo and does not hold a box average, which is the trade.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = lcd-mini-v3.glsl
minarch_shader2_filter = LINEAR
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
