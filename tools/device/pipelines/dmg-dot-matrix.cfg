# The dmg reference stack, first half: the dot matrix on its own, with the
# brightness and gamma this copy carries turned off.
#
# Those two are sinedied's additions to Status_Librarian_313's original, and the
# golden path is the shader WITHOUT them - grading belongs to the pass after.
# Set explicitly rather than left to the #pragma defaults, which ship them at
# 1.2 and 1.4, because a default that is not neutral would put grading in both
# rows and make the pair uncomparable.
#
# No scaler in front of it: it point-samples the source. That is the whole
# reason it is cheap, and the quality it trades away.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = dmg_dot_matrix.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen

dmg_brightness_correction = 1.00
dmg_gamma = 1.00
