# pixel-turbo at shipped defaults: the same scale as pixel-perfect from one tap.
#
# LINEAR, and that is the whole point. Through NEAREST the texture unit does no
# blending, the shader has no second tap to fall back on, and what gets measured
# is nearest-neighbour wearing this shader's name.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = pixel-turbo-v1.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
