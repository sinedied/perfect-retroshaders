# crt-turbo v4b. v4a with the warp's Jacobian pinned out of h, so h stays
# uniform-derived and hoistable. Identical to v4a at cp_curvature 0; the pair
# measures what carrying curvature costs a user who never enables it.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = crt-perfect-v14.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
