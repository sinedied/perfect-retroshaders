# Grading, isolated. The cheapest scale in the repo with nothing on it but the
# colour controls the *-perfect shaders carry inline, as a separate pass.
#
# Subtracting the sharp-shimmerless row from this one is the answer to "what
# does brightness / gamma / white balance cost", measured against a real shader
# rather than inferred from an instruction count. It is also the upper bound on
# what a source-resolution grading pass could save, since this one runs at
# output resolution.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = image-adjustment.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen
