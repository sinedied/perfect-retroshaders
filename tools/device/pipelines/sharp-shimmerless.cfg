# The floor: the same area average from a SINGLE tap, with the texture unit
# doing the blend. 0 SFU and the cheapest thing in the repo, so it says how much
# of a row's cost is arithmetic and how much is just filling 1024x768.
#
# LINEAR, not NEAREST. This shader ships with filter_linear0 = true and measuring
# it through NEAREST measures nearest-neighbour, which is a different shader.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = sharp-shimmerless.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
