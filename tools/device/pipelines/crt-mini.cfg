# crt-mini alone, as pass 1, with curvature and the slot mask at their shipped
# defaults. There is no scaler in it, so the frontend's own upscale is what the
# picture gets: soft, and that is the documented standalone behaviour.
#
# Read against crt-turbo: the difference is the price of the one-tap box scale.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 1
minarch_shader1 = crt-mini-v2.glsl
minarch_shader1_filter = LINEAR
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
