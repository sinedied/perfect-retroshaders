# The two-pass alternative a user would otherwise run: a pixellate scale feeding
# lcd3x. The only multi-pass row in the table, and the reason the harness has to
# model intermediate render targets at all.
#
# Pass settings are the ones NextUI's own "real-gba" style presets use, recovered
# verbatim from the comparison links in README.md.
minarch_screen_scaling = Aspect
minarch_scale_filter = NEAREST

minarch_nrofshaders = 2
minarch_shader1 = pixellate.glsl
minarch_shader1_filter = NEAREST
minarch_shader1_srctype = source
minarch_shader1_scaletype = source
minarch_shader1_upscale = screen
minarch_shader2 = lcd3x.glsl
minarch_shader2_filter = NEAREST
minarch_shader2_srctype = source
minarch_shader2_scaletype = source
minarch_shader2_upscale = screen

INTERPOLATE_IN_LINEAR_GAMMA = 1.00
